<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Story Game</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css?family=VT323" rel="stylesheet">
</head>
<body>

  <!-- CRT EFFECTS -->
  <div class="scanlines"></div>
  <div class="glow"></div>

  <!-- GAME -->
  <div id="game">
    <div id="question" class="typewriter"></div>
    <div id="options"></div>
  </div>

  <!-- DEATH SCREEN -->
  <div id="death">
    <div class="eye"></div>
  </div>

  <!-- AUDIO -->
  <audio id="typeSound" src="sounds/type.mp3"></audio>
  <audio id="selectSound" src="sounds/select.mp3"></audio>
  <audio id="dieSound" src="sounds/die.mp3"></audio>
  <audio id="bgMusic" src="sounds/bg.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
